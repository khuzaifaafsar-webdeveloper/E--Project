<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CARVAN About</title>

<style>
    
    .about{
animation:fadeSection 1.5s ease;
}

@keyframes fadeSection{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}
    .card{
position:relative;
overflow:hidden;
}

.card::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:50%;
height:100%;
background:rgba(255,255,255,0.3);
transform:skewX(-25deg);
transition:0.7s;
}

.card:hover::before{
left:120%;
}
    .card{
animation:slideUp 1s ease forwards;
opacity:0;
}

@keyframes slideUp{

0%{
opacity:0;
transform:translateY(60px);
}

100%{
opacity:1;
transform:translateY(0);
}

}
    .btn{
background:#ff3c00;
color:white;
border:none;
padding:10px 18px;
cursor:pointer;
border-radius:6px;
transition:0.3s;
}

.btn:hover{
background:#111;
box-shadow:0 0 15px #ff3c00,
0 0 30px #ff3c00;
transform:scale(1.1);
}
.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
text-align:center;
transition:all 0.4s ease;
transform-style:preserve-3d;
}

.card:hover{
transform:translateY(-12px) scale(1.04) rotateX(5deg);
box-shadow:0 25px 40px rgba(0,0,0,0.3);
}
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

/* HEADER */

header{
background:#111;
color:white;
padding:15px 5%;
}

.logo{
font-size:24px;
color:#ff3c00;
font-weight:bold;
}

/* ABOUT */

.about{
text-align:center;
padding:40px;
background:gray;
}

/* SEARCH */

.search-box{
text-align:center;
margin:20px;
}

.search-box input{
padding:10px;
width:250px;
}

/* CAR GRID */

.cars{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
padding:40px;
}

/* CARD */

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 10px rgba(0,0,0,0.2);
text-align:center;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card h3{
margin:10px 0;
}

.btn{
background:#ff3c00;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
margin-bottom:15px;
}

/* MODAL */

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:30px;
max-width:400px;
text-align:center;
border-radius:10px;
}

.close{
float:right;
cursor:pointer;
font-size:20px;
}

/* RESPONSIVE */

@media(max-width:900px){
.cars{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:600px){
.cars{
grid-template-columns:1fr;
}
}

</style>

</head>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<span class="close" onclick="closeModal()">✖</span>

<h2 id="name"></h2>

<p id="price"></p>
<p id="engine"></p>
<p id="fuel"></p>
<p id="mileage"></p>

</div>

</div>

<script>

/* SEARCH */

document.getElementById("search").addEventListener("keyup", function(){

let value=this.value.toLowerCase();

document.querySelectorAll(".card").forEach(function(card){

let name=card.innerText.toLowerCase();

card.style.display=name.includes(value) ? "block" : "none";

});

});

/* DETAILS */

function details(name,price,engine,fuel,mileage){

document.getElementById("modal").style.display="flex";

document.getElementById("name").innerText=name;

document.getElementById("price").innerText="Price: $"+price;

document.getElementById("engine").innerText="Engine: "+engine;

document.getElementById("fuel").innerText="Fuel: "+fuel;

document.getElementById("mileage").innerText="Mileage: "+mileage;

}

function closeModal(){

document.getElementById("modal").style.display="none";

}

</script>

</body>
